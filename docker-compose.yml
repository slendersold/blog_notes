services:
  postgres:
    image: postgres:17
    # без container_name: второй стек (`docker compose -p …`) не конфликтует по имени контейнера
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog_user
      POSTGRES_PASSWORD: blog_pass
      POSTGRES_DB: blog_db
    ports:
      - "${PG_HOST_PORT:-5432}:5432"
    volumes:
      - blog_notes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog_user -d blog_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  blog_notes_pgdata:
