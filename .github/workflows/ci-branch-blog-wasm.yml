# Не-main ветки: только blog-wasm.
name: CI branch · blog-wasm

on:
  push:
    branches-ignore:
      - main
      - master
    paths:
      - "blog-wasm/**"
      - ".github/workflows/ci-branch-blog-wasm.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  blog-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Format (workspace)
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p blog-wasm --all-targets --no-deps -- -D warnings

      - name: Build (native lib check)
        run: cargo build -p blog-wasm

      - name: Tests (lib)
        run: cargo test -p blog-wasm --lib

      - name: Build WASM target
        run: cargo build -p blog-wasm --target wasm32-unknown-unknown
