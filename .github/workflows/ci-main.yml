# Ветка main/master: полный прогон всего workspace — все крейты, fmt/clippy, тесты,
# интеграционный сценарий blog-integration-tests (Docker Compose + параллельные CLI),
# отдельный шаг с Postgres для #[ignored] миграций blog-server.
name: CI (main · full workspace)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blog_integration_test

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blog_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blog_integration_test"
          --health-interval 4s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v5

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

      - name: Build (workspace)
        run: cargo build --workspace

      # blog-integration-tests/build.rs проверяет наличие blog-cli и blog-server в target;
      # явная сборка гарантирует порядок до cargo test на ранжированных воркерах CI.
      - name: Build blog-cli and blog-server binaries (for blog-integration-tests build.rs)
        run: cargo build -p blog-cli -p blog-server

      # Все unit-, integration- и doc-тесты (включая Docker Compose в cli_five_clients_integration).
      - name: "Tests: full workspace (Docker required for blog-integration-tests)"
        run: cargo test --workspace

      - name: "Integration tests with Postgres (ignored test; needs DATABASE_URL)"
        run: cargo test -p blog-server --test migrations_integration -- --ignored --nocapture

      - name: Build WASM
        run: cargo build -p blog-wasm --target wasm32-unknown-unknown
