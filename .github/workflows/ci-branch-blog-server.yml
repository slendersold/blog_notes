# Не-main ветки: только blog-server (без Postgres и без интеграционных `tests/`).
name: CI branch · blog-server

on:
  push:
    branches-ignore:
      - main
      - master
    paths:
      - "blog-server/**"
      - ".github/workflows/ci-branch-blog-server.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  blog-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format (workspace)
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p blog-server --all-targets --no-deps -- -D warnings

      - name: Build
        run: cargo build -p blog-server

      - name: "Tests (unit / bin-only crate)"
        run: |
          cargo test -p blog-server --bin blog-server
